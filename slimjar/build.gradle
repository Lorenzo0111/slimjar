plugins {
    id 'java'
    id 'maven-publish'
}

version = '1.3.0'

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    testImplementation 'com.google.code.gson:gson:2.9.0'
    testImplementation group: 'junit', name: 'junit', version: '4.13.2'
    // Mockito 4.x is the last line supporting Java 8, a recent Byte Buddy is required for newer JDKs
    testImplementation 'org.mockito:mockito-core:4.11.0'
    testImplementation 'net.bytebuddy:byte-buddy:1.18.14'
    testImplementation 'net.bytebuddy:byte-buddy-agent:1.18.14'
}

publishing {
    publications {
        mavenPublish(MavenPublication) {
            from components.java
            groupId = 'me.lorenzo0111'
            artifactId = 'slimjar'
            version = project.version
            pom {
                name = "SlimJar"
                description = "A simple and robust runtime dependency manager for JVM languages."
                url = "http://www.github.com/Lorenzo0111/slimjar"
                licenses {
                    license {
                        name = "The MIT License"
                        url = "https://opensource.org/licenses/MIT"
                    }
                }
                developers {
                    developer {
                        id = "vshnv"
                        name = "Vaishnav Anil"
                        email = "vaishnavanil7th@gmail.com"
                    }
                    developer {
                        id = "ipsk"
                        name = "Mateus Moreira"
                    }
                }
                scm {
                    connection = "https://github.com/Lorenzo0111/slimjar"
                    developerConnection = "https://github.com/Lorenzo0111/slimjar.git"
                    url = "https://github.com/Lorenzo0111/slimjar"
                }
            }

        }
    }
    repositories {
        maven {
            url = "https://dl.lorenzo0111.me/releases"

            credentials {
                username = project.findProperty("lorenzo0111RepositoryUsername") ?: ""
                password = project.findProperty("lorenzo0111RepositoryPassword") ?: ""
            }
            authentication {
                basic(BasicAuthentication)
            }
        }
    }
}


// Bundles the agent jar so it can be attached at runtime when no other injection strategy is available
jar {
    from(project(':loader-agent').tasks.named('jar')) {
        rename { 'loader-agent.isolated-jar' }
    }
}
